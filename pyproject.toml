[project]
name = "my-agent-backend"
version = "0.1.0"
description = "Local AI infrastructure worker (llama-swap + Streamlit UI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.27.0",
    "psutil>=5",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pynvml>=11",
    "pyyaml>=6",
    "streamlit>=1.61.1",
]

[project.scripts]
genesis-worker-ui = "genesis_worker.cli.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis_worker"]
include = ["genesis_worker/services/llama_swap/data/recipes.yaml"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["genesis_worker/tests"]
markers = [
    "integration: touches real subprocesses, sockets, or system resources. Run with `pytest -m integration`. Exclude from fast unit runs with `pytest -m 'not integration'`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/dist", "**/build", "**/.venv", "vendor", "bin"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["genesis_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["B", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "standard"
include = ["genesis_worker"]
exclude = ["**/__pycache__", "**/dist", "**/build", "**/.venv", "vendor", "bin", ".venv"]
