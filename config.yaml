# llama-swap config for my-agent-backend
#
# Listens on 0.0.0.0:8080 by default (override on the CLI with -listen addr:port).
#
# All entries use the PrismML/llama.cpp fork from ./vendor/prism-llama.cpp
# (CUDA-built). The 4 newer entries keep the same proven settings:
#   -c 262144  -ngl 99  -fa on  --jinja  --parallel 1 (set where needed)
# no KV-cache quantization (KV_TYPE=f16). The 26B and 35B have MoE layers
# whose expert weights spill off-GPU to fit 262k ctx in 16 GB.

healthCheckTimeout: 60
logLevel: info

models:
  # ---------------------------------------------------------------------
  # Bonsai 27B (PrismML ternary Q2_0, kept at its tuned 150k ctx + q8_0 KV)
  # ---------------------------------------------------------------------
  bonsai-27b-q2:
    name: "Ternary Bonsai 27B (Q2_0)"
    cmd: |
      /home/gentran1991/Documents/GitHub/my-agent-backend/vendor/prism-llama.cpp/build/bin/llama-server \
        --model /home/gentran1991/Data2/models/huggingface/hub/models--prism-ml--Ternary-Bonsai-27B-gguf/snapshots/20e435f518bd5b882795954aba81e80a91894321/Ternary-Bonsai-27B-Q2_0.gguf \
        --mmproj /home/gentran1991/Data2/models/huggingface/hub/models--prism-ml--Ternary-Bonsai-27B-gguf/snapshots/20e435f518bd5b882795954aba81e80a91894321/Ternary-Bonsai-27B-mmproj-Q8_0.gguf \
        -c 150000 -ctk q8_0 -ctv q8_0 -ngl 99 --jinja --parallel 1 \
        --port ${PORT} --host 127.0.0.1 \
        --temp 0.7 --top-p 0.95 --top-k 20
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 0

  # ---------------------------------------------------------------------
