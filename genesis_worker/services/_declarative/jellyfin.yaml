# Jellyfin declarative service spec.
#
# Self-hosted media server (jellyfin/jellyfin). The official Debian-based
# image serves HTTP on port 8096; we map host 8096 -> container 8096
# (avoiding llama-swap 8080, bifrost 8090, worker API 9090, ntfy 8092,
# and all other in-use ports). Three volumes survive container restarts:
#   - ``$data_dir/config`` -> /config  (Jellyfin config, DB, metadata)
#   - ``$data_dir/cache``  -> /cache  (transcoding cache, thumbnails)
#   - ``$options.media_dir`` -> /media  (read-only media library)
# Jellyfin handles its own UID/GID inside the container (no puid/pgid
# defaults). The optional ``JELLYFIN_PublishedServerUrl`` and any other
# Jellyfin env vars flow through ``extra_env``. See
# https://jellyfin.org/docs/general/installation/container.

version: 1
kind: docker
name: jellyfin
display_name: Jellyfin
description: Self-hosted media server for video and music
category: media

capabilities:
  can_generate_config: false
  can_export_for_agent: false
  can_serve_llm: false
  can_serve_image: false
  can_train_models: false
  has_web_ui: true
  can_install: true

resource_estimate:
  vram_bytes_typical: 0
  vram_bytes_min: 0
  cpu_cores_recommended: 2

image:
  repo: jellyfin/jellyfin
  tag: latest
  install_name: jellyfin
  source_url: https://hub.docker.com/r/jellyfin/jellyfin

container:
  name: jellyfin
  listen_host: 0.0.0.0
  listen_port: $options.listen_port
  internal_port: 8096
  health_probe_path: /
  web_ui_path: /
  restart_policy: unless-stopped

env:
  TZ: "$options.tz"
  JELLYFIN_PublishedServerUrl: "$options.published_server_url"

volumes:
  /config: "$data_dir/config"
  /cache: "$data_dir/cache"
  /media: "$options.media_dir"

options:
  listen_port:
    type: port
    default: 8096
    ui_label: Web UI port
    ui_help: Host-side port Jellyfin's web UI listens on
    ui_group: Network
  tz:
    type: string
    default: "UTC"
    ui_label: Timezone
    ui_help: Container timezone (IANA tz database name, e.g. UTC or Australia/Adelaide)
    ui_group: General
  media_dir:
    type: path
    default: "$media_vault_path"
    ui_label: Media directory
    ui_help: Directory Jellyfin scans for video and music (defaults to the worker's media vault at ~/media). Jellyfin accesses this read-only.
    ui_group: Storage
  published_server_url:
    type: string
    default: ""
    ui_label: Public server URL
    ui_help: External URL Jellyfin uses for DLNA/discovery links (e.g. https://jellyfin.example.com). Leave blank to use the internal address.
    ui_group: Network
  extra_env:
    type: env_map
    default: {}
    ui_label: Extra environment variables
    ui_help: Additional JELLYFIN_* env vars (see https://jellyfin.org/docs/general/installation/container)
    ui_group: Advanced
  extra_mounts:
    type: mount_map
    default: {}
    ui_label: Extra volume mounts
    ui_help: Additional host->container bind mounts (e.g. extra media libraries)
    ui_group: Advanced
