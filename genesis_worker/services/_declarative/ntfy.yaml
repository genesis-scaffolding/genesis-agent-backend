# ntfy declarative service spec.
#
# Self-hosted pub-sub notification server (binwiederhier/ntfy). The
# image exposes its web UI and HTTP API on port 80; we map host
# 8092 -> container 80 (avoiding llama-swap's 8080, bifrost's 8090,
# and the worker API's 9090). The message cache lives under
# ``$data_dir/cache`` so message history survives container
# restarts. Attachment persistence is OPT-IN: ntfy refuses to start
# if ``attachment-cache-dir`` is set without ``base-url`` (see
# https://docs.ntfy.sh/config/#message-attachments), so we leave
# both unset by default and let operators enable them together via
# the ``base_url`` + ``attachment_cache_dir`` options. See
# https://docs.ntfy.sh/install/.

version: 1
kind: docker
name: ntfy
display_name: ntfy
description: Push notification server
category: utility

capabilities:
  can_generate_config: false
  can_export_for_agent: false
  can_serve_llm: false
  can_serve_image: false
  can_train_models: false
  has_web_ui: true
  can_install: true

resource_estimate:
  vram_bytes_typical: 0
  vram_bytes_min: 0
  cpu_cores_recommended: 1

image:
  repo: binwiederhier/ntfy
  tag: latest
  install_name: ntfy
  source_url: https://hub.docker.com/r/binwiederhier/ntfy

container:
  name: ntfy
  listen_host: 0.0.0.0
  listen_port: $options.listen_port
  internal_port: 80            # ntfy's default
  health_probe_path: /v1/health
  web_ui_path: /
  restart_policy: unless-stopped
  puid_default: true
  pgid_default: true

env:
  TZ: "$options.tz"
  NTFY_BASE_URL: "$options.base_url"
  # ``NTFY_CACHE_FILE`` is read by ntfy INSIDE the container, so it
  # must be the *container* path (``/var/cache/ntfy/cache.db``), not
  # the host path. The bind mount under ``volumes:`` maps the host
  # ``$data_dir/cache`` to ``/var/cache/ntfy`` so the two are
  # equivalent from ntfy's perspective; using ``$data_dir/cache``
  # here would put a host path in the container's env, which ntfy
  # would then fail to stat. Same trap applies to ``attachment_cache_dir``.
  NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
  NTFY_ATTACHMENT_CACHE_DIR: "$options.attachment_cache_dir"
  NTFY_AUTH_DEFAULT_ACCESS: "$options.auth_default_access"

volumes:
  /var/cache/ntfy: "$data_dir/cache"

# The ``binwiederhier/ntfy`` image declares ``ENTRYPOINT=[ntfy]`` and
# an empty ``CMD``; without an explicit subcommand the container runs
# ``ntfy`` (no args) and prints help instead of starting the server.
# Pin ``serve`` here so docker invokes ``ntfy serve``. Other ntfy
# config is wired through ``NTFY_*`` env vars above.
extra_args:
  - serve

options:
  listen_port:
    type: port
    default: 8092
    ui_label: Web UI port
    ui_help: Host-side port the ntfy web UI listens on
    ui_group: Network
  tz:
    type: string
    default: "UTC"
    ui_label: Timezone
    ui_help: Container timezone (IANA tz database name, e.g. UTC or Europe/Paris)
    ui_group: General
  base_url:
    type: string
    default: ""
    ui_label: External base URL
    ui_help: Public URL ntfy uses for links and absolute topic references (e.g. https://ntfy.example.com). Leave blank to auto-detect. Required when attachment_cache_dir is set.
    ui_group: General
  attachment_cache_dir:
    type: string
    default: ""
    ui_label: Attachment cache directory
    ui_help: Container path where uploaded attachments are persisted (e.g. /var/cache/ntfy/attachments). Requires base_url to be set. Leave blank to disable attachment persistence (matches ntfy's default; ntfy treats an empty string as "not set").
    ui_group: Storage
  auth_default_access:
    type: string
    default: "read-write"
    ui_label: Default access
    ui_help: "Access level for anonymous users: read-write, read-only, write-only, deny-all (see https://docs.ntfy.sh/config/#access-control)"
    ui_group: Access
  extra_env:
    type: env_map
    default: {}
    ui_label: Extra environment variables
    ui_help: Additional NTFY_* env vars (see https://docs.ntfy.sh/config/)
    ui_group: Advanced
