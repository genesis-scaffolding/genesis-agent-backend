# ROMM — self-hosted ROM library manager.
# https://docs.romm.app/latest/getting-started/quick-start/
# Ships as a docker compose stack: romm (web app) + romm-db (PostgreSQL).

version: 1
kind: compose
name: romm
display_name: ROMM
description: Self-hosted ROM library manager
category: media

capabilities:
  can_generate_config: false
  can_export_for_agent: false
  can_serve_llm: false
  can_serve_image: false
  can_train_models: false
  has_web_ui: true
  can_install: true

resource_estimate:
  vram_bytes_typical: 0
  vram_bytes_min: 0
  cpu_cores_recommended: 2

compose_version: "3.8"
health_probe_path: /
# Default port 8101 — 8080 is taken by llama-swap.

# Every image the stack uses, declared here (framework-level, NOT a user
# option — the options panel is for app tuning only). Each gets a real
# DockerImageInstall (registry tags, GUI version pick). The template names
# each image via $images.<name>, substituted at render time with the
# effective ref (recorded selection wins over default_tag).
images:
  - name: romm
    repo: rommapp/romm
    default_tag: latest
  - name: romm-db
    repo: postgres
    default_tag: 16-alpine

# No top-level listen_host / listen_port: the options block is the single
# source of truth (options.listen_port), and the loader derives the
# runtime port (health probe, web UI endpoint) from the resolved option.

# The compose_template is a plain string populated by the standard
# $placeholder mechanism ($state_dir, $data_dir, $options.X) at load
# time — the same mechanism every other declarative service uses. No
# second templating layer; the stored template is ready to write to disk.
compose_template: |
  version: "3.8"
  services:
    romm:
      image: $images.romm
      container_name: romm
      restart: unless-stopped
      ports:
        - "$options.listen_host:$options.listen_port:8080"
      environment:
        # ROMM 5.x env scheme (bare DB_* + ROMM_DB_DRIVER), not the
        # legacy ROMM_DB_* names. Driver must be postgresql and port 5432
        # — the defaults (mariadb / 3306) do not match our postgres db.
        ROMM_DB_DRIVER: postgresql
        DB_HOST: romm-db
        DB_PORT: "5432"
        DB_USER: $options.db_user
        DB_PASSWD: "$options.db_password"
        DB_NAME: $options.db_name
        ROMM_FRONTEND: "1"
      volumes:
        - $state_dir/library:/romm/library
        - $state_dir/config:/romm/config
        - $options.roms_dir:/romm/roms
      healthcheck:
        # ROMM 5.x serves /health (not /api/health, which 404s).
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    romm-db:
      image: $images.romm-db
      container_name: romm-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: $options.db_name
        POSTGRES_USER: $options.db_user
        POSTGRES_PASSWORD: "$options.db_password"
      volumes:
        - $state_dir/db:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "$options.db_user"]
        interval: 10s
        timeout: 5s
        retries: 5

options:
  listen_host:
    type: string
    default: "0.0.0.0"
    ui_label: Listen host
    ui_group: Network
  listen_port:
    type: port
    default: 8101
    ui_label: Web UI port
    ui_group: Network
  roms_dir:
    type: path
    default: "$media_vault_path/roms"
    ui_label: ROMs directory
    ui_help: Host directory for ROM files (defaults to <media vault>/roms)
    ui_group: Storage
  db_name:
    type: string
    default: "romm"
    ui_label: Database name
    ui_group: Database
  db_user:
    type: string
    default: "romm"
    ui_label: Database user
    ui_group: Database
  db_password:
    type: string
    default: "changeme"
    ui_label: Database password
    ui_help: Change this to a strong unique password before starting
    ui_group: Database
