version: 1
kind: docker
name: photoprism
display_name: PhotoPrism
description: Photo and video organizer
category: media

capabilities:
  can_generate_config: false
  can_export_for_agent: false
  can_serve_llm: false
  can_serve_image: false
  can_train_models: false
  has_web_ui: true
  can_install: true

resource_estimate:
  vram_bytes_typical: 0
  vram_bytes_min: 0
  cpu_cores_recommended: 2

image:
  repo: photoprism/photoprism
  tag: latest
  install_name: photoprism
  source_url: https://hub.docker.com/r/photoprism/photoprism

container:
  name: photoprism
  listen_host: 0.0.0.0
  listen_port: 2342
  internal_port: 2342
  health_probe_path: /
  web_ui_path: /
  restart_policy: unless-stopped
  puid_default: true
  pgid_default: true
  security_opts:
    - seccomp=unconfined
    - apparmor=unconfined

env:
  PHOTOPRISM_UPLOAD_NSFW: "true"
  PHOTOPRISM_ADMIN_PASSWORD: "insecure"

volumes:
  /photoprism/storage: "$data_dir/storage"
  /photoprism/originals: "$data_dir/.."

