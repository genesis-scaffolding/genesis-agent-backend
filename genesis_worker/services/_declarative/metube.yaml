# MeTube declarative service spec.
#
# Self-hosted YouTube/yt-dlp downloader with a web UI (alexta69/metube).
# Python/Flask backend + browser frontend; yt-dlp handles the actual
# extraction. Downloads land in ``/downloads`` (bind-mounted from
# ``$options.download_dir``) so Jellyfin picks them up via the shared
# media vault. The ``STATE_DIR`` defaults to ``/downloads/.metube`` and
# stores the queue, history, subscriptions, and uploaded cookies so
# sessions survive container restarts. Host port 8098 avoids every other
# in-use port in this stack.
# See https://github.com/alexta69/metube and the wiki at
# https://github.com/alexta69/metube/wiki.

version: 1
kind: docker
name: metube
display_name: MeTube
description: Self-hosted YouTube/yt-dlp downloader with a web UI
category: media

capabilities:
  can_generate_config: false
  can_export_for_agent: false
  can_serve_llm: false
  can_serve_image: false
  can_train_models: false
  has_web_ui: true
  can_install: true

resource_estimate:
  vram_bytes_typical: 0
  vram_bytes_min: 0
  cpu_cores_recommended: 1

image:
  repo: ghcr.io/alexta69/metube
  tag: latest
  install_name: metube
  source_url: https://github.com/alexta69/metube/pkgs/container/metube

container:
  name: metube
  listen_host: 0.0.0.0
  listen_port: $options.listen_port
  internal_port: 8081
  health_probe_path: /
  web_ui_path: /
  restart_policy: unless-stopped
  puid_default: true
  pgid_default: true

env:
  PUID: "$options.puid"
  PGID: "$options.pgid"
  DOWNLOAD_DIR: "/downloads"

volumes:
  /downloads: "$options.download_dir"

options:
  listen_port:
    type: port
    default: 8098
    ui_label: Web UI port
    ui_help: Host-side port the MeTube web UI listens on
    ui_group: Network
  download_dir:
    type: path
    default: "$media_vault_path"
    ui_label: Download directory
    ui_help: Host directory where downloaded files are saved (defaults to the worker's media vault at ~/media so Jellyfin can pick them up)
    ui_group: Storage
  puid:
    type: int
    default: 1000
    ui_label: User ID (PUID)
    ui_help: Numeric UID the container process runs as; set to your host UID (usually 1000)
    ui_group: Permissions
  pgid:
    type: int
    default: 1000
    ui_label: Group ID (PGID)
    ui_help: Numeric GID the container process runs as; set to your host GID (usually 1000)
    ui_group: Permissions
  extra_env:
    type: env_map
    default: {}
    ui_label: Extra environment variables
    ui_help: Additional MeTube env vars (see https://github.com/alexta69/metube#configuration)
    ui_group: Advanced
  extra_mounts:
    type: mount_map
    default: {}
    ui_label: Extra volume mounts
    ui_help: Additional host->container bind mounts
    ui_group: Advanced
