# recipes.yaml — family-level profiles for build_config.py.
#
# ============================================================================
# Available fields
# ============================================================================
#
# match:                     (required for non-default recipes)
#   Substring keyword matched against the model name (the part after `/`).
#   Case-insensitive; hyphens, underscores, and dots in the keyword are
#   stripped before matching. Recipes whose match is a substring of another
#   matched recipe's keyword are SHADOWED (only the longer/more specific one
#   applies). Recipes that share a match keyword are SIBLINGS — all emit
#   entries (e.g. qwen3.6-thinking + qwen3.6-instruct both match "qwen3.6").
#
# binary:                    (optional; cascades from default)
#   Path to llama-server. Absolute paths used as-is; relative paths resolved
#   against the repo root.
#
# sampling:                  (optional; cascades from default)
#   Dict of sampling knobs. Recognised keys (any subset):
#     temp, top_p, top_k, min_p, presence_penalty, repeat_penalty.
#   Each is emitted as `--<flag> <value>`. The recipe's whole sampling dict
#   REPLACES the default's — there's no field-level merge. So if you set
#   sampling, include all the knobs you want, not just the ones you want
#   to override.
#
# chat_template_file:        (optional)
#   Path to a Jinja chat template file. Overrides --jinja. Used by gemma-4
#   recipes (Unsloth's Qwen3 templates work with --jinja).
#
# chat_template_kwargs:      (optional)
#   Dict of kwargs passed as --chat-template-kwargs JSON. Used by Qwen3
#   recipes for `preserve_thinking: true` / `enable_thinking: false`.
#
# parallel:                  (optional; cascades from default)
#   Number of parallel slots. Usually 1.
#
# spec:                      (optional)
#   MTP speculative decoding config. Example:
#     spec: {type: draft-mtp, n_max: 2, p_min: 0.75}
#   Only applied if the model actually has MTP (embedded or as a
#   separate mtp-*.gguf piece in the catalog).
#
# kv_cache:                  (optional)
#   Explicit KV cache dtype. "q8_0" or "q4_0". When set, ALWAYS emits
#   -ctk/-ctv regardless of weight size, bypassing the auto-threshold.
#   Use this to force q8_0 KV on a specific recipe (e.g. for tight VRAM).
#
# mmproj_offload:            (optional)
#   Boolean. true = always emit --no-mmproj-offload (keep vision tower in
#   RAM); false = never emit (keep on GPU). Unset = use the auto-threshold
#   based on weight size (KV_QUANT_OVER / MMPROJ_OFFLOAD_OVER constants in
#   bin/build-config.py).
#
# ctx_min:                   (optional; cascades from default; default 131072)
#   Floor for llama.cpp's --fit-ctx. Recipes can raise the floor (Bonsai
#   uses 150000 to keep ctx from dropping below its tuning point). Setting
#   ctx_min lower than default doesn't override the default; the floor is
#   always at least the default unless you also change the default.
#
# reasoning_budget:          (optional; cascades from default)
#   Token cap on a single reasoning/thinking block. -1 is unrestricted
#   (llama.cpp default), 0 forces the model to skip thinking entirely,
#   N>0 caps thinking to N tokens. Once the cap is hit, llama.cpp forces
#   the end-of-thinking tag (e.g. </think>) and resumes normal sampling.
#   The chat template must advertise start/end reasoning sequences for
#   the budget sampler to activate; Qwen3.6 and Gemma4 do, Bonsai and
#   Ornith do not. Use this on families that occasionally runaway-think.
#   See the "Reasoning budget" section below.
#
# reasoning_budget_message:  (optional; cascades from default)
#   Short prompt injected just before the forced end-of-thinking tag when
#   the budget is hit (e.g. "Final answer:"). Only emitted when non-empty.
#   Models trained with reasoning budget tolerate a short injected phrase.
#
# ============================================================================
# Reasoning budget
# ============================================================================
#
# Qwen3.6 and Gemma4 can enter long thinking loops. The reasoning_budget
# sampler in llama.cpp watches the model's thinking block, counts tokens,
# and forces the end-of-thinking tag once the cap is reached. The cap is a
# hard limit per reasoning block; the model can no longer think past N
# tokens. The sampler re-arms if the model emits another start tag, so
# multi-think responses get a fresh budget per block.
#
# Recipe values reflect observed medians plus headroom:
#   qwen3.5 / gemma4 / lfm2:  4-8k (shallow thinkers)
#   qwen3.6 (general):       12k   (deep thinker)
#   qwen3.6-27b:              16k   (deeper; will sometimes use the full cap)
#   qwen3.6-instruct:         0     (instruct sibling forces immediate end;
#                                    no reasoning)
#   bonsai / ornith:          unset (let llama.cpp default; the cap is not
#                                    the right tool for those models)
# ============================================================================
# Resolution order (per field)
# ============================================================================
#
# Most fields cascade: recipe value -> default recipe value -> hardcoded
# fallback (or omitted entirely if neither has it).
#
# `binary` is special: recipe -> CLI --binary -> default recipe -> hardcoded.
#
# `mmproj_offload` has three states:
#   recipe.mmproj_offload (True/False) -> default.mmproj_offload ->
#   threshold-based auto (weight_bytes > MMPROJ_OFFLOAD_OVER).
#
# `kv_cache` is a string ("q8_0"/"q4_0") or unset. When unset, falls back
# to threshold-based auto (weight_bytes > KV_QUANT_OVER).
#
# ============================================================================
# Examples
# ============================================================================
#
# Shadow the general qwen3.6 recipe to force tighter VRAM settings on the
# 27B variant (which is ~20 GB and would NOT auto-trigger the threshold):
#
#   qwen3.6-27b:
#     match: "qwen3.6-27b"   # shadows qwen3.6 (because "qwen3.6" ⊂ "qwen3.6-27b")
#     # Sampling inherits from default unless overridden here.
#     kv_cache: q8_0          # always-on q8_0 KV (was threshold-gated)
#     mmproj_offload: true    # always offload mmproj (was threshold-gated)
#
# Force q4_0 KV on a specific model and never offload mmproj:
#
#   myweirdmodel:
#     match: "myweirdmodel"
#     kv_cache: q4_0
#     mmproj_offload: false
#
# Disable a feature that was inherited from default:
#
#   lightmodel:
#     match: "lightmodel"
#     kv_cache: q4_0          # explicit -- no longer threshold-gated
# ============================================================================

recipes:

  # ---------------------------------------------------------------------
  # default: applied when no family recipe matches; also the source of
  # cascaded defaults for any field a recipe omits.
  # ---------------------------------------------------------------------
  default:
    binary: "vendor/llama.cpp/build/bin/llama-server"   # stock llama.cpp
    ctx_min: 131072                   # 128k floor for --fit-ctx (2^17)
    parallel: 1
    sampling:
      temp: 0.8
      top_p: 0.95
      top_k: 40

  # ---------------------------------------------------------------------
  # Qwen3.6 — emit both thinking and instruct variants per model.
  # Both share match "qwen3.6" so any Qwen3.6 repo emits two entries.
  # Inherits ctx_min / parallel from default.
  # ---------------------------------------------------------------------
  qwen3.6-thinking:
    match: "qwen3.6"
    sampling:
      temp: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repeat_penalty: 1.0
    chat_template_kwargs:
      preserve_thinking: true
    spec:
      type: draft-mtp
      n_max: 2
    reasoning_budget: 12288

  qwen3.6-instruct:
    match: "qwen3.6"
    sampling:
      temp: 0.7
      top_p: 0.8
      top_k: 20
      presence_penalty: 1.5
      min_p: 0.0
    chat_template_kwargs:
      enable_thinking: false
    spec:
      type: draft-mtp
      n_max: 2
      p_min: 0.75
    reasoning_budget: 0

  # ---------------------------------------------------------------------
  # Qwen3.6 27B variant — shadows qwen3.6 for any model with "qwen3.6-27b"
  # in the name (the regular Q4 ~20 GB and the Fable IQ2_M). Identical
  # sampling/template/MTP as the generic qwen3.6-thinking/-instruct, but
  # forces q8_0 KV cache and mmproj offload to RAM. The 27B sits just
  # under the auto-threshold so neither flag would otherwise trigger.
  # ---------------------------------------------------------------------
  qwen3.6-27b-thinking:
    match: "qwen3.6-27b"
    sampling:
      temp: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repeat_penalty: 1.0
    chat_template_kwargs:
      preserve_thinking: true
    spec:
      type: draft-mtp
      n_max: 2
    kv_cache: q8_0
    mmproj_offload: true
    reasoning_budget: 16384

  qwen3.6-27b-instruct:
    match: "qwen3.6-27b"
    sampling:
      temp: 0.7
      top_p: 0.8
      top_k: 20
      presence_penalty: 1.5
      min_p: 0.0
    chat_template_kwargs:
      enable_thinking: false
    spec:
      type: draft-mtp
      n_max: 2
      p_min: 0.75
    kv_cache: q8_0
    mmproj_offload: true
    reasoning_budget: 0

  # ---------------------------------------------------------------------
  # Gemma 4 — all gemma-4-* quants share this. (Add gemma4-12b /
  # gemma4-26b overrides later if 12B and 26B need different sampling.)
  # Inherits ctx_min / parallel from default.
  # ---------------------------------------------------------------------
  gemma4:
    match: "gemma4"
    sampling:
      temp: 1.0
      top_p: 0.95
      top_k: 64
    chat_template_file: "/home/gentran1991/Documents/GitHub/my-agent-backend/templates/gemma-4-chat-template.jinja"
    spec:
      type: draft-mtp
      n_max: 2
    reasoning_budget: 8192

  # ---------------------------------------------------------------------
  # Ornith — small text-only reasoning model. Inherits all the rest.
  # ---------------------------------------------------------------------
  ornith:
    match: "ornith"
    sampling:
      temp: 0.6
      top_p: 0.95
      top_k: 20

  # ---------------------------------------------------------------------
  # Bonsai — ternary Q2_0, tight on 16 GB; force q8_0 KV + 150k ctx floor.
  # Inherits parallel from default.
  # ---------------------------------------------------------------------
  bonsai:
    binary: "vendor/prism-llama.cpp/build/bin/llama-server"   # PrismML fork; ternary Q2_0 needs custom kernels
    match: "bonsai"
    sampling:
      temp: 0.7
      top_p: 0.95
      top_k: 20
    kv_cache: q8_0
    ctx_min: 150000

  # ---------------------------------------------------------------------
  # LFM2 — LiquidAI LFM2.5 series. Recommended params: temp 0.1, top_k 50,
  # repetition_penalty 1.1 (no top_p per upstream guidance). Max context
  # 131072 = model's training context; pinned explicitly so it doesn't
  # track any future change to the default --fit-ctx floor.
  # Inherits parallel from default.
  # ---------------------------------------------------------------------
  lfm2:
    match: "lfm2"
    sampling:
      temp: 0.1
      top_k: 50
      repeat_penalty: 1.1
    ctx_min: 131072
    reasoning_budget: 4096